# Its token is how the API reaches the Kubernetes API when DEPLOYMENT_BACKEND=kubernetes; what it may do is granted
# by a RoleBinding in the controlled namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: copilot-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  # Safe to scale out: runs, checkpoints and approvals live in Postgres, and exactly-once execution is enforced there.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      serviceAccountName: copilot-api
      # Shutdown waits for in-flight remediations to finish verifying (remediation.verification.timeout_seconds,
      # 300 s), so a rollout doesn't cut one off mid-way.
      terminationGracePeriodSeconds: 330
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: rag-copilot-api
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: copilot-config
            - secretRef:
                name: copilot-secrets
          # Ready only when Postgres and Redis answer.
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 10
          # Alive is just "accepting connections": a database outage shouldn't restart every pod.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http
