# The demo payments service. Its version is DEMO_VERSION plus the matching app.kubernetes.io/version label (which is
# what the copilot reports as the version); changing both is a real rollout with a new revision:
#   kubectl -n payments patch deployment payments --type=json -p '[...]'   (see `make k8s-release`)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  labels:
    app.kubernetes.io/name: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payments
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments
        app.kubernetes.io/version: v1
    spec:
      automountServiceAccountToken: false
      containers:
        - name: payments
          image: rag-copilot-payments
          # Plain uvicorn: no telemetry collector in this cluster.
          command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - name: DEMO_VERSION
              value: v1
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: payments
spec:
  selector:
    app.kubernetes.io/name: payments
  ports:
    - port: 8000
