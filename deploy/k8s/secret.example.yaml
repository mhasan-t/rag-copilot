# Template for the copilot-secrets Secret every deployment needs. Never commit real values; create it with your
# secret tooling, e.g.:
#   kubectl create secret generic copilot-secrets -n <namespace> \
#     --from-literal=DATABASE_URL=... --from-literal=AUTH_JWT_SECRET=... --from-literal=LLM_API_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: copilot-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://<user>:<password>@<host>:5432/<database>
  # At least 32 characters; generate with `openssl rand -hex 32`.
  AUTH_JWT_SECRET: <random secret>
  # Optional for keyless providers such as a self-hosted Ollama.
  LLM_API_KEY: <llm provider api key>
  EMBEDDING_API_KEY: <embedding provider api key>
