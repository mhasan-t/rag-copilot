name: rag-copilot

# Shared by the api and its one-shot migration job.
x-api: &api
  build:
    context: ./api
    args:
      UV_SYNC_FLAGS: "" # include dev tools (pytest, ruff) in the dev image
  env_file: api/.env
  # Addresses of the other dev containers; credentials come from the root .env so they are defined once.
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    PROMETHEUS_URL: http://lgtm:9090
    LOKI_URL: http://lgtm:3100
    TEMPO_URL: http://lgtm:3200
    DEPLOYMENT_BACKEND: demo
    DEMO_PAYMENTS_ADMIN_URL: http://payments:8000
    # The API's own traces, metrics and logs go to the same LGTM stack it monitors.
    TELEMETRY_TRACES_ENABLED: ${TELEMETRY_TRACES_ENABLED:-true}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
  # Lets the containers reach model servers running on the host (e.g. Ollama).
  extra_hosts:
    - host.docker.internal:host-gateway
  volumes:
    - ./api:/app

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.10-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Grafana + Loki + Tempo + Prometheus + OTel Collector: the monitored stack and the copilot's own telemetry.
  lgtm:
    image: grafana/otel-lgtm:0.36.0
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/rag-copilot.yaml:ro
      - ./config/grafana/dashboards:/otel-lgtm/rag-copilot-dashboards:ro
      # Metrics, logs and traces survive container restarts.
      - lgtm-data:/data

  # Dev-only demo service the copilot monitors and remediates; see demo_payments/app.py.
  payments:
    build: ./demo_payments
    environment:
      OTEL_SERVICE_NAME: payments
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_LOGS_EXPORTER: otlp
      OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
      # Stable HTTP semantic conventions: http.server.request.duration in seconds.
      OTEL_SEMCONV_STABILITY_OPT_IN: http
      OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: healthz,admin
      # Export every 5s (default 60s) so a deploy shows up in metrics quickly.
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
    ports:
      - "8001:8000"
    depends_on:
      - lgtm

  loadgen:
    build: ./demo_payments
    command: ["python", "loadgen.py"]
    environment:
      LOADGEN_TARGET_URL: http://payments:8000
      LOADGEN_REQUESTS_PER_SECOND: "5"
    depends_on:
      - payments

  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  lgtm-data:
